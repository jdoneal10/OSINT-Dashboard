  # --- Other non-designated cartels ----------------------------------------------------------

  - slug: cartel-de-tijuana
    canonical_name: Cartel de Tijuana
    actor_type: tco
    country_iso3: MEX
    description: >-
      Also known as the Arellano Felix Organization. Remnants reportedly allied with CJNG
      from 2016 (InSight Crime). ACLED's "CTNG: Tijuana New Generation Cartel" is not
      linked: no checked source uses that name.
    aliases:
      - {alias: Tijuana Cartel, language: en}  # also ACLED
      - {alias: Arellano Felix Organization, language: en}
      - {alias: AFO}
    sources:
