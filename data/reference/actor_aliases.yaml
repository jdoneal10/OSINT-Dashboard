    country_iso3: MEX
    description: Designated Foreign Terrorist Organization (2025-02-20).
    aliases:
      - {alias: CJNG}
      - {alias: New Generation Cartel of Jalisco, language: en}
      - {alias: Jalisco New Generation Cartel, language: en}
    sources: *fto_2025

  - slug: carteles-unidos
    canonical_name: Carteles Unidos
    actor_type: tco
    country_iso3: MEX
