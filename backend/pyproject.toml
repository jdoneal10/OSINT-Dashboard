[project]
name = "cartel-osint"
version = "0.1.0"
description = "Local-first OSINT dashboard backend (UNCLASSIFIED, PAI only)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "fastapi>=0.162.5",
    "geoalchemy2>=0.21.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "honcho>=2.0.0",
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261111",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N", "DTZ", "PT"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "PLR0911", "PLR0917"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
exclude = ["app/db/migrations/"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "shapely.*", "keyring.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
