repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.md$
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: block-raw-data
        name: block data/raw and ACLED exports (CLAUDE.md rule 5)
        entry: "Refusing to commit raw source data or ACLED-derived exports."
        language: fail
        files: (^data/raw/|acled.*\.(csv|parquet|xlsx)$)

      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd backend && uv run ruff check --force-exclude .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format --check
        entry: bash -c 'cd backend && uv run ruff format --check .'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: mypy
        name: mypy (strict on app/)
        entry: bash -c 'cd backend && uv run mypy'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false

      - id: eslint
        name: eslint
        entry: bash -c 'cd frontend && npm run --silent lint'
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false

      - id: prettier
        name: prettier --check
        entry: bash -c 'cd frontend && npm run --silent format:check'
        language: system
        files: ^frontend/
        pass_filenames: false
