      - {alias: Cartel de Tepalcatepec, language: es}
      - {alias: The Grandfather Cartel, language: en}
      - {alias: Cartel del Abuelo, language: es}
      - {alias: Cartel de Los Reyes, language: es}
    sources: *fto_2025

  - slug: cartel-del-noreste
    canonical_name: Cartel del Noreste
    actor_type: tco
    country_iso3: MEX
    description: Designated Foreign Terrorist Organization (2025-02-20).
    aliases:
      - {alias: CDN}
      - {alias: Northeast Cartel, language: en}
      - {alias: Los Zetas, language: es}
    sources: *fto_2025

  - slug: cartel-del-golfo
    canonical_name: Cartel del Golfo
    actor_type: tco
    country_iso3: MEX
    description: Designated Foreign Terrorist Organization (2025-02-20).
    aliases:
