        publisher: InSight Crime
        url: https://www.insightcrime.org/mexico-organized-crime-news/tijuana-cartel/
        accessed: 2026-11-11

  - slug: beltran-leyva-organization
    canonical_name: Beltran Leyva Organization
    actor_type: tco
    country_iso3: MEX
    description: Worked with the Sinaloa Cartel until the two split in 2008 (InSight Crime).
    aliases:
      - {alias: BLO}
      - {alias: Beltran Leyva Cartel, language: en}  # ACLED
    sources:
      - title: Beltran Leyva Organization (profile)
        publisher: InSight Crime
        url: https://insightcrime.org/mexico-organized-crime-news/beltran-leyva-organization-profile/
        accessed: 2026-11-11

  - slug: cartel-de-caborca
    canonical_name: Cartel de Caborca
    actor_type: tco
    country_iso3: MEX
