  - slug: la-nueva-familia-michoacana
    canonical_name: La Nueva Familia Michoacana
    actor_type: tco
    country_iso3: MEX
    description: Designated Foreign Terrorist Organization (2025-02-20).
    aliases:
      - {alias: LNFM}
    sources: *fto_2025

  # ------------------------------------------------------------------------------------
  # Factions, armed wings and non-designated cartels. Accessed 2026-11-11.

  # --- Sinaloa Cartel factions ---------------------------------------------------------

  - slug: los-chapitos
    canonical_name: Los Chapitos
    actor_type: faction
    parent: cartel-de-sinaloa
    country_iso3: MEX
    description: >-
      Faction of the Sinaloa Cartel led by sons of its imprisoned co-founder (Treasury,
      2025-06-09; InSight Crime). At war with the Mayiza faction since September 2024.
    aliases:
      - {alias: Chapitos}
      - {alias: Los Chapitos Gang, language: en}  # ACLED
    sources:
      - title: "Treasury Sanctions \"El Chapo's\" Children and Los Chapitos, a Fentanyl-Trafficking Faction of the Sinaloa Cartel (sb0161)"
        publisher: U.S. Department of the Treasury
        url: https://home.treasury.gov/news/press-releases/sb0161
        accessed: 2026-11-11
      - &ic_chapitos
        title: "The Chapitos: Who They Are, Where They Operate, and What Changed in 2026"
        publisher: InSight Crime
        url: https://insightcrime.org/mexico-organized-crime-news/los-chapitos/
        accessed: 2026-11-11

  - slug: mayiza
    canonical_name: La Mayiza
    actor_type: faction
    parent: cartel-de-sinaloa
    country_iso3: MEX
    description: >-
      Sinaloa Cartel faction associated with the Zambada family, also known as Los Mayos;
      rival of Los Chapitos (InSight Crime). ACLED codes no "Mayiza" string in the AOI as of
      2026-11; its armed wing Los Rusos links here.
    aliases:
      - {alias: Mayiza}
      - {alias: Los Mayos, language: es}
    sources:
      - &ic_mayiza
        title: Mayiza (profile)
        publisher: InSight Crime
        url: https://insightcrime.org/mexico-organized-crime-news/mayiza-profile/
        accessed: 2026-11-11

  - slug: los-rusos
    canonical_name: Los Rusos
    actor_type: faction
    parent: mayiza
    country_iso3: MEX
    description: >-
      Main armed wing of the Mayiza faction of the Sinaloa Cartel; active in Baja California
      and Sonora (InSight Crime Mayiza profile).
    aliases:
      - {alias: Rusos}
      - {alias: Los Rusos Gang, language: en}  # ACLED
    sources:
      - *ic_mayiza

  - slug: los-mayitos
    canonical_name: Los Mayitos
    actor_type: faction
    parent: cartel-de-sinaloa
    country_iso3: MEX
    description: >-
      Described by InSight Crime (2015, citing Zeta) as a cell working for Sinaloa Cartel
      leader Ismael Zambada in Baja California Sur; affiliations not officially confirmed.
      Linked to the Sinaloa Cartel, not to the Mayiza faction, because the 2026 Mayiza
      profile does not use the name and ACLED's usage may be broader.
    aliases:
      - {alias: Mayitos}
      - {alias: Los Mayitos Gang, language: en}  # ACLED
    sources:
      - title: Report Highlights Complexity of Mexico's Criminal Networks
        publisher: InSight Crime
        url: https://www.insightcrime.org/news/briefs/report-reflects-complexity-mexico-criminal-networks
        accessed: 2026-11-11
      - *ic_mayiza

  - slug: gente-nueva
    canonical_name: Gente Nueva
    actor_type: faction
    parent: los-chapitos
    country_iso3: MEX
    description: >-
      Armed branch associated with the Chapitos faction of the Sinaloa Cartel (InSight Crime
      Sinaloa Cartel profile). Fights La Linea in Chihuahua.
    aliases:
      - {alias: Gente Nueva Gang, language: en}  # ACLED
    sources:
      - &ic_sinaloa
        title: "The Sinaloa Cartel: When it Formed, Who's in Charge, Where it Operates and What's New in 2026"
        publisher: InSight Crime
        url: https://insightcrime.org/mexico-organized-crime-news/sinaloa-cartel/
        accessed: 2026-11-11

  - slug: los-salazar
    canonical_name: Los Salazar
    actor_type: faction
    parent: los-chapitos
    country_iso3: MEX
    description: >-
      Armed branch associated with the Chapitos faction of the Sinaloa Cartel (InSight Crime
      Sinaloa Cartel profile).
    aliases:
      - {alias: Los Salazar Gang, language: en}  # ACLED
    sources:
      - *ic_sinaloa

  # --- Juarez Cartel and Ciudad Juarez groups --------------------------------------------

  - slug: cartel-de-juarez
    canonical_name: Cartel de Juarez
    actor_type: tco
    country_iso3: MEX
    description: Also known as the Vicente Carrillo Fuentes Organization (InSight Crime).
    aliases:
      - {alias: Juarez Cartel, language: en}  # also ACLED
      - {alias: Vicente Carrillo Fuentes Organization, language: en}
      - {alias: VCFO}
    sources:
      - &ic_juarez
        title: Juarez Cartel (profile)
        publisher: InSight Crime
        url: https://insightcrime.org/mexico-organized-crime-news/juarez-cartel-profile/
        accessed: 2026-11-11

  - slug: la-linea
    canonical_name: La Linea
    actor_type: faction
    parent: cartel-de-juarez
    country_iso3: MEX
    description: >-
      Armed / enforcement wing of the Juarez Cartel (InSight Crime). InSight Crime's 2026
      profile notes it now operates more as an independent criminal network.
    aliases:
      - {alias: La Linea Gang, language: en}  # ACLED
    sources:
      - *ic_juarez
      - &ic_linea
        title: La Linea (profile)
        publisher: InSight Crime
        url: https://insightcrime.org/mexico-organized-crime-news/la-linea/
        accessed: 2026-11-11

  - slug: barrio-azteca
    canonical_name: Barrio Azteca
    actor_type: armed_group
    country_iso3: MEX
    description: >-
      Prison and street gang described as a key ally of the Juarez Cartel and La Linea
      (InSight Crime, 2025). Ally, not a faction: no parent link.
    aliases:
      - {alias: Los Aztecas, language: es}
      - {alias: Los Aztecas Gang, language: en}  # ACLED
    sources:
      - &ic_juarez_guard
        title: In Ciudad Juarez, Mexico, Old Criminal Groups Form New Criminal Guard
        publisher: InSight Crime
        url: https://insightcrime.org/news/ciudad-juarez-mexico-old-criminal-groups-new-guard/
        accessed: 2026-11-11

  - slug: los-mexicles
    canonical_name: Los Mexicles
    actor_type: armed_group
    country_iso3: MEX
    description: >-
      Juarez gang that sided with the Sinaloa Cartel in the Juarez war and later operated
      apart from it (InSight Crime, 2025). Former ally, not a faction: no parent link.
    aliases:
      - {alias: Mexicles}
      - {alias: Los Mexicles Gang, language: en}  # ACLED
    sources:
      - *ic_juarez_guard

  - slug: la-empresa
    canonical_name: La Empresa
    actor_type: armed_group
    country_iso3: MEX
    description: >-
      Ciudad Juarez group of disputed origin: officials variously call it a breakaway of La
      Linea or of Barrio Azteca (InSight Crime). Origin unresolved: no parent link.
    aliases:
      - {alias: La Empresa Gang, language: en}  # ACLED
    sources:
      - *ic_juarez_guard
      - *ic_linea

  - slug: nuevo-cartel-de-juarez
    canonical_name: Nuevo Cartel de Juarez
    actor_type: armed_group
    country_iso3: MEX
    description: >-
      Name used by some La Linea members; InSight Crime says it is unclear whether it is a
      splinter of La Linea or a change of name, and reports an alleged CJNG alliance. No
      parent link.
    aliases:
      - {alias: New Juarez Cartel, language: en}
      - {alias: "NCDJ: New Juarez Cartel", language: en}  # ACLED
    sources:
